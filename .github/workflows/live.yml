name: Live

# Started by hand only, from the Actions tab: no schedule. It runs every case
# again against the models with the OPENROUTER_API_KEY secret, writes the
# results to results-live/, compares them with the committed baseline (the
# drift since the recording) and uploads the results, the run's log and the
# gate's report as an artifact. It commits nothing. The CI badge reflects
# ci.yml only, which replays the recorded calls and needs no key.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  key:
    # Without the secret, a notice says so and the live job below is skipped;
    # the workflow never fails for a missing key.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      present: ${{ steps.check.outputs.present }}
    steps:
      - name: Check for the API key
        id: check
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ -n "$OPENROUTER_API_KEY" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Live run skipped::The repository has no OPENROUTER_API_KEY secret, so the live run is skipped. CI replays the recorded calls on every push and needs no key."
          fi

  live:
    needs: key
    if: needs.key.outputs.present == 'true'
    runs-on: ubuntu-latest
    # A full run sends up to the whole call plan at the configured requests
    # per minute (config/models.yaml), one call at a time.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: python -m pip install -e .

      # The budget guard and the free-request check run before any call; a
      # failed call stops the run and nothing is written but the log.
      - name: Live run
        shell: bash
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          mkdir -p results-live
          llmeval live --results-dir results-live 2>&1 | tee results-live/live-run.txt

      # A rate that fell below the baseline by more than its tolerance in
      # config/gate.yaml, or any new safety failure, fails this step.
      - name: Gate against the baseline
        shell: bash
        run: llmeval gate --results-dir results-live 2>&1 | tee results-live/drift-report.txt

      - name: Upload the drift report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: drift-report
          path: results-live
          if-no-files-found: ignore
