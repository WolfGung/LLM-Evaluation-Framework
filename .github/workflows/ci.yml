name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # Unit tests and replay only: no network, no API key, no secrets.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      # Unit, app and repository tests. The repository tests include the check
      # that the committed results/ equal a fresh replay of the cassettes.
      - name: Test
        run: pytest -W error --ignore=tests/eval --alluredir=allure-results

      # Replays the recorded run into a temporary directory (the committed
      # results/ stay untouched), runs the gate against the committed baseline
      # (key rates within config/gate.yaml), then compares each case with the
      # baseline. A failed replay ends the step. The gate and the per-case
      # tests both run, and the step fails if either failed: a regression, a
      # new safety failure, a missing case, or a known failure that now passes
      # without a baseline update. Green while pending (no manifest).
      - name: Eval
        env:
          REPLAY_DIR: ${{ runner.temp }}/replay
        run: |
          rc=0
          llmeval eval --results-dir "$REPLAY_DIR"
          llmeval gate --results-dir "$REPLAY_DIR" || rc=1
          pytest -W error tests/eval --alluredir=allure-results || rc=1
          exit $rc

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-results
          path: allure-results
          if-no-files-found: ignore
