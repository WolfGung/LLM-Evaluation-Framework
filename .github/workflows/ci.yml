name: CI

# Every push to main and every pull request: lint, unit and repository tests,
# then the replay evaluation. The tests reach no network and use no key.
# A push to main also builds the page and the Allure report from that run and
# deploys them to GitHub Pages, straight from the workflow.
on:
  push:
    branches: [main]
  pull_request:

# Read-only everywhere but the one job that deploys the page, which asks for
# what a Pages deployment takes and nothing more.
permissions:
  contents: read

jobs:
  test:
    # Unit tests and replay only: no network, no API key, no secrets.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      # Unit, app and repository tests. The repository tests include the check
      # that the committed results/ equal a fresh replay of the cassettes.
      - name: Test
        run: pytest -W error --ignore=tests/eval --alluredir=allure-results

      # Replays the recorded run into a temporary directory (the committed
      # results/ stay untouched) and writes the judge agreement there, as make
      # eval does (broken labels fail the step). Then runs the gate against the
      # committed baseline (key rates within config/gate.yaml) and compares each
      # case with the baseline. A failed replay ends the step. The agreement,
      # the gate and the per-case tests all run, and the step fails if any
      # failed: broken labels, a regression, a new safety failure, a missing
      # case, or a known failure that now passes without a baseline update.
      # Green while pending (no manifest).
      - name: Eval
        env:
          REPLAY_DIR: ${{ runner.temp }}/replay
        run: |
          rc=0
          llmeval eval --results-dir "$REPLAY_DIR"
          llmeval agreement --results-dir "$REPLAY_DIR" || rc=1
          llmeval gate --results-dir "$REPLAY_DIR" || rc=1
          pytest -W error tests/eval --alluredir=allure-results || rc=1
          exit $rc

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-results
          path: allure-results
          if-no-files-found: ignore

  pages:
    # The page and the Allure report, built from the green run above and
    # published from main only: a pull request's ref is refs/pull/<n>/merge
    # and never gets here.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # One deployment at a time; a newer one waits for the one under way
    # rather than cancelling it halfway through.
    concurrency:
      group: pages
      cancel-in-progress: false
    env:
      ALLURE_VERSION: "2.30.0"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: python -m pip install -e .

      - uses: actions/download-artifact@v8
        with:
          name: allure-results
          path: allure-results

      - name: Install the Allure command line
        run: |
          curl -fsSL -o "$RUNNER_TEMP/allure.tgz" \
            "https://github.com/allure-framework/allure2/releases/download/$ALLURE_VERSION/allure-$ALLURE_VERSION.tgz"
          tar -xzf "$RUNNER_TEMP/allure.tgz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/allure-$ALLURE_VERSION/bin" >> "$GITHUB_PATH"

      # The page carries the README results table (from the committed results/)
      # and links the report under report/. The runner image ships the Java
      # that allure generate needs, so there is no setup-java step.
      - name: Build the page and the report
        run: |
          python -m tools.site
          allure generate allure-results --clean --output site/report

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v5
