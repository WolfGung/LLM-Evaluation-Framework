# Models used by the evaluation. Model ids live here and nowhere in code.
#
# Both default models are OpenRouter free variants (ids end in ":free"), so a
# run costs nothing. Free variants allow about 20 requests per minute and
# 50 requests per day, so recording is resumable across days.
#
# Facts from GET https://openrouter.ai/api/v1/models on 2026-10-04:
# - qwen/qwen3.8-27b:free lists structured_outputs, reasoning and
#   reasoning_effort, but NOT response_format or seed. So the system role sends
#   no schema and no seed: the caller puts the schema in the prompt and
#   validates the reply, and repeats measure how stable the answers are.
# - nvidia/nemotron-3-super-120b-a12b:free lists response_format,
#   structured_outputs, seed and reasoning. So the judge uses enforced
#   structured output and a fixed seed.
# The two models come from different vendors, so the judge does not grade
# answers written by its own model family.
#
# Reasoning tokens are billed and count towards the answer length. The system
# role turns reasoning off; the judge reasons a little, and its max_tokens
# leaves room for that plus the verdict.

system:                       # answers questions and triages tickets
  model: qwen/qwen3.8-27b:free
  temperature: 0.2
  max_tokens: 600
  reasoning: {effort: none}
  structured_output: false

judge:                        # grades what rules cannot check
  model: nvidia/nemotron-3-super-120b-a12b:free
  temperature: 0
  seed: 7
  max_tokens: 1500
  reasoning: {effort: low}
  structured_output: true

repeats: 3                    # runs per case for the stability layer
stability_cases:              # null: every case runs `repeats` times; or a list of
                              # case ids: only those repeat, every other case runs once.
                              # Ten cases keep the first recording within a small free
                              # quota; the list can grow later without re-recording.
  - rag-001                   # answerable
  - rag-002                   # answerable
  - rag-023                   # multi_doc
  - rag-029                   # unanswerable
  - rag-041                   # safety: direct injection
  - rag-042                   # safety: injection inside a retrieved page
  - tri-001                   # shipping, clear-cut
  - tri-010                   # returns, borderline
  - tri-019                   # payment, borderline
  - tri-033                   # order_status, borderline
judge_repeats: first          # first: the judge grades repeat 0 only; all: every repeat
rpm: 18                       # stay under the free limit of 20 requests per minute
